<!DOCTYPE html> <!-- Declaração do tipo de documento. Indica que este é um documento HTML5. -->

<html lang="en"> <!-- Início do documento HTML. O atributo "lang" define que o idioma principal da página é inglês. -->

<head> <!-- Início da seção de cabeçalho da página. Essa parte contém informações sobre a página, mas não exibe nada visualmente. -->

    <meta charset="UTF-8"> 
    <!-- Define a codificação de caracteres como UTF-8. Isso garante que caracteres especiais, como acentos e símbolos, sejam exibidos corretamente. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Configuração para tornar a página responsiva, garantindo que ela se ajuste automaticamente ao tamanho da tela do dispositivo (computador, celular, tablet). -->

    <title>Document</title> 
    <!-- Define o título da página, que aparecerá na aba do navegador. -->

</head>

<body> <!-- Início do corpo do documento. Tudo que está dentro dessa tag será exibido na página. -->

    <!-- Texto indicando que a próxima seção é uma lista não ordenada -->
    Lista não Ordenada

    <h2>Mapa do Site</h2> 
    <!-- Título de nível 2 (subtítulo) indicando que a seção abaixo contém um mapa do site. -->

    <!-- Lista não ordenada (ul - unordered list). Itens aparecem com marcadores (bolinhas, quadrados, etc.). -->
    <!-- O atributo "type" define o tipo do marcador. Os valores possíveis são: "disc" (círculo preenchido, padrão), "circle" (círculo vazio) e "square" (quadrado). -->
    <ul type="disc">
        <li>Home</li> <!-- Item da lista representando a página inicial. -->
        <li>Quem somos</li> <!-- Item da lista representando a página "Quem somos". -->
        <li>Contato</li> <!-- Item da lista representando a página de contato. -->
    </ul>

    <!-- Texto indicando que a próxima seção é uma lista ordenada -->
    Lista Ordenada

    <h2>Perguntas</h2> 
    <!-- Título de nível 2 (subtítulo) indicando que a seção abaixo contém uma lista de perguntas. -->

    <!-- Lista ordenada (ol - ordered list). Os itens aparecem numerados ou com letras/numeração romana, dependendo do "type". -->
    <!-- O atributo "type" define o tipo da numeração. Os valores possíveis são: 
        - "1" (números padrão: 1, 2, 3...)
        - "A" (letras maiúsculas: A, B, C...)
        - "a" (letras minúsculas: a, b, c...)
        - "I" (números romanos maiúsculos: I, II, III...)
        - "i" (números romanos minúsculos: i, ii, iii...) -->
    <ol type="i">
        <li>Comida favorita?</li> <!-- Item da lista perguntando sobre a comida favorita. -->
        <li>Carro favorito?</li> <!-- Item da lista perguntando sobre o carro favorito. -->
        <li>Série favorita?</li> <!-- Item da lista perguntando sobre a série favorita. -->
    </ol>

</body> <!-- Fim do corpo da página. -->

</html> <!-- Fim do documento HTML. -->
