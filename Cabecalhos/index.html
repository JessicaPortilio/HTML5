<!DOCTYPE html> <!-- Declaração do tipo de documento. Define que este é um documento HTML5. -->

<html lang="en"> <!-- Início do documento HTML. O atributo "lang" define o idioma principal da página como inglês. -->

<head> <!-- Início da seção de cabeçalho da página. Essa parte contém informações sobre a página que não aparecem diretamente para o usuário. -->

    <meta charset="UTF-8"> 
    <!-- Define a codificação de caracteres como UTF-8, permitindo que caracteres especiais, como acentos e símbolos, sejam exibidos corretamente. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Configura a página para ser responsiva, ajustando a largura da tela para o tamanho do dispositivo (computador, celular, tablet). -->

    <title>Document</title> 
    <!-- Define o título da página, que aparece na aba do navegador quando o site está aberto. -->

</head>

<body> <!-- Início do corpo do documento. Tudo dentro dessa tag será exibido no navegador. -->

    <h1>Sobre a empresa</h1> 
    <!-- Título principal da página. A tag <h1> é usada para os títulos mais importantes. -->

    Essa é uma empresa tal... 
    <!-- Texto simples que aparece abaixo do título <h1>. -->

    <h2>Cabeçalho 2</h2> 
    <!-- Título de segundo nível. Um pouco menor que <h1>, usado para organizar melhor o conteúdo. -->

    <h3>Cabeçalho 3</h3> 
    <!-- Título de terceiro nível. É menor que <h2> e usado para seções secundárias. -->

    <h4>Cabeçalho 4</h4> 
    <!-- Título de quarto nível. Geralmente usado para subtópicos dentro de <h3>. -->

    <h5>Cabeçalho 5</h5> 
    <!-- Título de quinto nível. Ainda menor, utilizado para detalhes dentro de subtópicos. -->

    <h6>Cabeçalho 6</h6> 
    <!-- Título de sexto nível. O menor de todos, usado para informações menos relevantes dentro da hierarquia do conteúdo. -->

</body> <!-- Fim do corpo da página. -->

</html> <!-- Fim do documento HTML. -->
