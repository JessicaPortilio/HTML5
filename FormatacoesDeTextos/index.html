<!DOCTYPE html> <!-- Declaração do tipo de documento. Indica que este é um documento HTML5. -->

<html lang="en"> <!-- Início do documento HTML. O atributo "lang" define que o idioma principal da página é inglês. -->

<head> <!-- Início da seção de cabeçalho da página. Essa parte contém configurações e informações da página, mas não exibe nada visualmente. -->

    <meta charset="UTF-8"> 
    <!-- Define a codificação de caracteres como UTF-8. Isso garante que caracteres especiais, como acentos e símbolos, sejam exibidos corretamente. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Faz com que a página se ajuste automaticamente ao tamanho da tela do dispositivo (computador, celular, tablet), tornando-a responsiva. -->

    <title>Document</title> 
    <!-- Define o título da página, que aparecerá na aba do navegador. -->

</head>

<body> <!-- Início do corpo do documento. Tudo que está dentro dessa tag será exibido na página. -->

    Esse é um texto <b>negrito</b><br> 
    <!-- Exibe um texto normal, seguido da palavra "negrito" em negrito usando a tag <b> (bold). -->
    <!-- A tag <br> quebra a linha, fazendo com que o próximo conteúdo fique na linha de baixo. -->

    Outra forma de deixar <strong>negrito</strong><br> 
    <!-- Outra maneira de deixar um texto em negrito, mas usando a tag <strong>, que tem um significado semântico (diz que esse texto é importante). -->

    Esse é um texto <i>itálico</i><br> 
    <!-- Exibe um texto normal, seguido da palavra "itálico" em itálico usando a tag <i>. -->

    Outra forma de deixar <em>itálico</em><br> 
    <!-- Outra forma de colocar o texto em itálico, mas usando a tag <em> (ênfase), que tem um significado semântico (indica que o texto deve ser enfatizado). -->

    Esse é um texto <u>underline</u><br> 
    <!-- Exibe um texto normal, seguido da palavra "underline" sublinhada usando a tag <u>. -->

    Esse é um texto <strike>errado</strike><br> 
    <!-- Exibe um texto normal, seguido da palavra "errado" riscada usando a tag <strike>, que indica que o texto foi removido ou está incorreto. -->

</body> <!-- Fim do corpo da página. -->

</html> <!-- Fim do documento HTML. -->
