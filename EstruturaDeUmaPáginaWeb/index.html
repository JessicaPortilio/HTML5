<!-- b = bold -> negrito -->
<!DOCTYPE html> <!-- Declaração do tipo de documento. Indica que este é um documento HTML5. -->
<html lang="en"> <!-- Início do documento HTML. O atributo "lang" define o idioma principal da página como inglês. -->

<head> <!-- Cabeçalho do documento. Contém informações sobre a página que não são visíveis diretamente no conteúdo. -->

    <meta charset="UTF-8"> <!-- Define a codificação de caracteres como UTF-8, permitindo o uso de caracteres especiais e acentos corretamente. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Configura a página para ser responsiva em dispositivos móveis, ajustando a largura da tela para o tamanho do dispositivo. -->

    <title>Meu Site</title> <!-- Define o título da página, que aparece na aba do navegador. -->

</head>

<body> <!-- Corpo da página. Tudo dentro dessa tag será exibido no navegador. -->

    Meu primeiro site <!-- Texto simples que será exibido na página ao ser carregada no navegador. -->

</body>
</html> <!-- Fim do documento HTML. -->
