<!DOCTYPE html>
<html lang="en">
<!-- Declara que este é um documento HTML5 e define o idioma da página como inglês -->

<head>
    <meta charset="UTF-8">
    <!-- Define o conjunto de caracteres da página como UTF-8, permitindo o uso de caracteres especiais como "ç", "á", "é", etc. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Configura a página para se ajustar ao tamanho da tela do dispositivo, tornando-a responsiva para celulares, tablets e computadores. -->

    <title>Caracteres Especiais</title>
    <!-- Define o título da página, que será exibido na aba do navegador. -->
</head>

<body>
    <!-- Início do corpo da página, onde o conteúdo visível será exibido. -->

    <h2>Caracteres Especiais</h2>
    <!-- Cria um título de nível 2 com o texto "Caracteres Especiais". O título é maior e mais destacado do que o texto normal. -->

    <!-- Character Entities -->
    <!-- Aqui vamos exibir alguns caracteres especiais que não podem ser escritos diretamente no código HTML. -->

    &lt;p&gt;
    <!-- O código "&lt;" representa o caractere "<" e "&gt;" representa o caractere ">".
        Isso significa que, ao ser exibido no navegador, aparecerá "<p>" ao invés de ser interpretado como uma tag HTML. -->

    <br>
    <!-- A tag "<br>" cria uma quebra de linha, movendo o conteúdo seguinte para a próxima linha. -->

    home &nbsp;&nbsp;&nbsp;&nbsp; - quem somos - contato
    <!-- O texto "home - quem somos - contato" representa um menu de navegação simples.
        O código "&nbsp;" significa "non-breaking space" (espaço em branco fixo). 
        Cada "&nbsp;" adiciona um espaço entre as palavras "home" e "- quem somos".
        Como há quatro "&nbsp;", isso cria um espaço extra entre as palavras. -->

</body>
<!-- Fim do corpo da página. -->

</html>
<!-- Fim do documento HTML. -->
