<!DOCTYPE html>
<html lang="en"> 
<!-- Declara que este é um documento HTML5 e define o idioma como inglês -->

<head>
    <meta charset="UTF-8"> 
    <!-- Define a codificação de caracteres como UTF-8, permitindo o uso de caracteres especiais corretamente -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Garante que a página seja exibida corretamente em diferentes dispositivos, como celulares e computadores -->

    <title>Tabelas</title> 
    <!-- Define o título da página, que aparece na aba do navegador -->
</head>

<body> 
    <!-- Início do corpo da página, onde o conteúdo visível será colocado -->

    <table border="2"> 
    <!-- Cria uma tabela e define uma borda com espessura de 2 pixels ao redor dela -->

        <tr> 
        <!-- Inicia uma nova linha da tabela -->

            <th>Coluna 1</th> 
            <!-- Cria um cabeçalho para a primeira coluna, geralmente mostrado em negrito -->

            <th>Coluna 2</th> 
            <!-- Cria um cabeçalho para a segunda coluna -->

            <th>Coluna 3</th> 
            <!-- Cria um cabeçalho para a terceira coluna -->
        </tr> 
        <!-- Fecha a linha do cabeçalho da tabela -->

        <tr> 
        <!-- Inicia uma nova linha na tabela -->

            <td>Linha 1 baixo da coluna 1</td> 
            <!-- Adiciona uma célula com texto abaixo da primeira coluna -->

            <td>Linha 1 baixo da coluna 2 </td> 
            <!-- Adiciona uma célula com texto abaixo da segunda coluna -->

            <td>Linha 1 baixo da coluna 3</td> 
            <!-- Adiciona uma célula com texto abaixo da terceira coluna -->
        </tr> 
        <!-- Fecha a segunda linha da tabela -->
    </table> 
    <!-- Fecha a tabela -->
</body>
<!-- Fecha o corpo da página -->

</html>
<!-- Fecha o documento HTML -->
